
<!DOCTYPE html>
<html>
<head>
    <title>String methods and math object</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            color: pink;
            font-weight: bold;
        }

        h1 {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<script>
let str = "We are haripriya and shivani";

document.write("<h1>JavaScript - String Methods</h1><br><br>");

document.write(str + "<br>");

document.write("Length of strings: " + str.length + "<br>");

document.write("Index of first occurrence of 'a' in a string: "
    + str.indexOf('a') + "<br>");

document.write("Index of 'are' in a string: "
    + str.indexOf("are") + "<br>");

document.write("Index of 0 to 3 using slice: "
    + str.slice(0, 3) + "<br>");

document.write("Substring using substring: "
    + str.substring(2, 7) + "<br>");

document.write("String to uppercase: "
    + str.toUpperCase() + "<br>");

document.write("Replace haripriya with shivani in a string: "
    + str.replace("haripriya", "shivani") + "<br>");

document.write("Use trim: "
    + str.trim() + "<br>");

document.write("Character at index 5: "
    + str.charAt(5) + "<br>");

document.write("Numeric character code at index 5: "
    + str.charCodeAt(5) + "<br>");

document.write("<h1>MATH OBJECT</h1>");

document.write("Math object is a built-in object containing basic mathematical functions and constants.<br>");

document.write("Value of PI in radians: "
    + Math.PI + "<br>");

document.write("PI in degrees: "
    + (Math.PI * 180 / Math.PI) + "<br>");

document.write("Value of E: "
    + Math.E + "<br>");

document.write("Sign of -3: "
    + Math.sign(-3) + "<br>");

document.write("The 2nd power of 8 is: "
    + Math.pow(8, 2) + "<br>");

document.write("Round the value 6.7: "
    + Math.round(6.7) + "<br>");

document.write("Round the value 4.6: "
    + Math.round(4.6) + "<br>");

document.write("Ceil the value 4.4: "
    + Math.ceil(4.4) + "<br>");

document.write("Ceil the value 4.6: "
    + Math.ceil(4.6) + "<br>");

document.write("Floor value of 4.4 is: "
    + Math.floor(4.4) + "<br>");

</script>

</body>
</html>
